[workspace]
resolver = "2"
members = ["crates/script-env", "crates/validator", "crates/wsframe"]
# Different toolchain (xtensa) and build env; built from their own dirs.
# audio-bridge is here for the same reason: aubio's bindgen needs the macOS
# libclang, while the espup toolchain exports LIBCLANG_PATH pointing at the
# xtensa one. Both settings are correct for their own crate and cannot coexist
# in one config tree, so audio-bridge gets its own build root.
#
# grid-truth is excluded on dependency grounds rather than toolchain ones: it
# pulls SQLCipher and a vendored OpenSSL, and is macOS/Windows-only by a
# compile_error!. It is a dev tool run by hand, so neither belongs in the tree of
# a bare `cargo test` at the root.
exclude = [
    "firmware",
    "dmx-bridge",
    "crates/audio-bridge",
    "crates/grid-truth",
]

[workspace.dependencies]
# Restriction features shared by validator and firmware so both sides parse
# the same language. `no_time` keeps the wasm32-unknown-unknown build free of
# Instant, which doesn't exist on that target.
#
# `f32_float` rather than plain float support: rhai's FLOAT is f64 by default,
# and both the ESP32 and the S3 have a single-precision FPU only, so f64 would
# be software-emulated. f32 is what the hardware actually accelerates.
#
# `no_closure` stays on. Closures capture through shared cells (Rc/RefCell),
# which is heap churn on a board already near its floor, and nothing in the
# script API needs them — the DMX loop is straight-line integer and float math.
# `sync` makes rhai's Shared an Arc rather than an Rc, which is what lets the
# standard-library modules be built once at boot and handed to every per-run
# engine by pointer, instead of rebuilding ~69KB on every run.
# Pinned to a git revision because the bytecode VM is on rhai's main branch and
# not in a release yet. `grain` is what enables it; the crate calls it
# experimental.
rhai = { git = "https://github.com/rhaiscript/rhai", rev = "72ad275f0db410120945d31fa686647135f1f99f", features = [
    "grain",
    "sync",
    "only_i64",
    "no_closure",
    "no_module",
    "no_time",
    "f32_float",
] }

# rhaiper resolves rhai from crates.io, which would put two copies of the crate
# in the graph — and rhai's feature flags change what a `Dynamic` *is*, so two
# copies means two incompatible `Dynamic` types flowing through the same
# minifier. Point it at the same revision as everything else.
[patch.crates-io]
rhai = { git = "https://github.com/rhaiscript/rhai", rev = "72ad275f0db410120945d31fa686647135f1f99f" }
