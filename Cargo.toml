[workspace]
resolver = "2"
members = ["crates/script-env", "crates/validator", "crates/wsframe"]
# Different toolchain (xtensa) and build env; built from their own dirs.
exclude = ["firmware", "dmx-bridge"]

[workspace.dependencies]
# Restriction features shared by validator and firmware so both sides parse
# the same language. `no_time` keeps the wasm32-unknown-unknown build free of
# Instant, which doesn't exist on that target.
#
# `f32_float` rather than plain float support: rhai's FLOAT is f64 by default,
# and both the ESP32 and the S3 have a single-precision FPU only, so f64 would
# be software-emulated. f32 is what the hardware actually accelerates.
#
# `no_closure` stays on. Closures capture through shared cells (Rc/RefCell),
# which is heap churn on a board already near its floor, and nothing in the
# script API needs them — the DMX loop is straight-line integer and float math.
# `sync` makes rhai's Shared an Arc rather than an Rc, which is what lets the
# standard-library modules be built once at boot and handed to every per-run
# engine by pointer, instead of rebuilding ~69KB on every run.
rhai = { version = "1", features = [
    "sync",
    "only_i64",
    "no_closure",
    "no_module",
    "no_time",
    "f32_float",
] }

# When rhaigrain lands, this comes back:
#
#   [patch.crates-io]
#   rhai = { path = "vendor/rhai" }
#
# rhaigrain needs more of rhai public than the `internals` feature exposes and
# carries the delta as a patch. Cargo only honours `[patch]` from the top-level
# workspace, so rhaigrain's own copy does nothing when it is a dependency and
# this repo has to apply the same patch itself — see scripts/vendor-rhai.sh.
# Left commented because it makes every cargo command depend on having run that
# script first, which is not a cost worth paying until the dependency is real.
