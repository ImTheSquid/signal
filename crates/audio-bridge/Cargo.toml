[package]
name = "audio-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
anyhow = "1"
# TempoCNN's period estimate, run as generated Rust rather than through a runtime.
# Pre-release because burn-import 0.19 panics on the model's asymmetric padding —
# `same` padding with an even kernel — and only the 0.22 tree represents it. Pinned
# exactly, and `deck/build.sh` already passes `--locked`, so it cannot drift.
burn = { version = "=0.22.0-pre.2", default-features = false, features = [
    "ndarray",
    "std",
] }
# The code burn-import generates loads its weights through this and imports it by
# name, so it has to be a direct dependency rather than transitive.
burn-store = "=0.22.0-pre.2"
# 11025Hz for the model, from whatever rate the device negotiated. 48k is 147/640
# and 44.1k is exactly 1/4, so this cannot be a fixed decimation.
rubato = "0.16"
# Real-input FFT for the model's spectrogram. The Butterworth bands the light uses
# are unrelated and stay in the time domain.
realfft = "3"
# Lock-free SPSC ring: the audio callback must never allocate or block, and this
# is the handoff to the analysis thread.
rtrb = "0.3"
# WAV reading for the offline path, which is how the tracker gets tuned and
# tested without a live device.
hound = "3.5"
# Only for the terminal width. A status line that overruns the pane wraps, and
# then the in-place redraw clears one physical row of several and the rest
# scrolls away forever.
libc = "0.2"

# Fork of aubio-rs maintained by the bliss-rs project; the upstream crate is
# frozen at 2021. `builtin` compiles aubio from vendored sources, so neither
# platform needs a system libaubio — only a C compiler. The two tables differ
# only in how the FFI bindings are obtained, and are declared per-target so a
# build for one platform never pulls in the other's requirements.
#
# arm64-apple-darwin has no prebuilt bindings, so bindgen generates them against
# the vendored headers, using the libclang pinned in .cargo/config.toml.
[target.'cfg(target_os = "macos")'.dependencies]
bliss-audio-aubio-rs = { version = "0.2.4", default-features = false, features = [
    "builtin",
    "bindgen",
] }

# x86_64-linux-gnu bindings ship prebuilt, so the Steam Deck build needs no
# libclang at all — which is what keeps its build container to a stock rust
# image plus the ALSA headers.
[target.'cfg(target_os = "linux")'.dependencies]
bliss-audio-aubio-rs = { version = "0.2.4", default-features = false, features = [
    "builtin",
] }

# `onnx` only. The default features pull `safetensors`, which pulls a candle-core
# that burn-import no longer compiles against — a non-exhaustive match on DType's
# newer float variants. Reading an ONNX file needs none of it.
#
# All three are pure Rust, which is the point: the Deck's build container stays a
# stock rust image plus the ALSA headers, with no ONNX Runtime to cross-compile.
[build-dependencies]
burn-import = { version = "=0.22.0-pre.1", default-features = false, features = [
    "onnx",
] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
