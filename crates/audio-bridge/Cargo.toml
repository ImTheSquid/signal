[package]
name = "audio-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
# Fork of aubio-rs maintained by the bliss-rs project. The upstream `aubio-rs`
# is frozen at 2021; this one ships on macOS arm64, which is the only platform
# this daemon runs on. `builtin` compiles aubio from vendored sources so there
# is no system libaubio to install.
bliss-audio-aubio-rs = { version = "0.2.4", default-features = false, features = [
    "builtin",
    # No prebuilt bindings ship for arm64-apple-darwin; the build script says so
    # and stops. bindgen generates them against the vendored headers instead,
    # using the libclang pinned in .cargo/config.toml.
    "bindgen",
] }
cpal = "0.15"
anyhow = "1"
# Lock-free SPSC ring: the CoreAudio callback must never allocate or block, and
# this is the handoff to the analysis thread.
rtrb = "0.3"
# WAV reading for the offline path, which is how the tracker gets tuned and
# tested without a live device.
hound = "3.5"
