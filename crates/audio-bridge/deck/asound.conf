# Adds a `scarlett` capture PCM, so the daemon can name the interface instead of
# taking whatever PipeWire's default source happens to be.
#
# This is the only mechanism that pins it. The ALSA plugin routes by its own
# `capture_node` config key — PIPEWIRE_NODE means nothing to it, that variable
# belongs to pw-cat and friends — and a plugin arg cannot be reached through
# cpal, which can only open a device it has enumerated by name. So the node goes
# in a PCM of its own.
#
# ALSA_CONFIG_PATH replaces the root config rather than adding to it, hence the
# include: the system config, and then this.
</usr/share/alsa/alsa.conf>

pcm.scarlett {
	type pipewire

	# Read at open, not baked in: the node name carries the interface's serial
	# number. launch.sh resolves it and exports it.
	#
	# The fallback is PipeWire's own "just use the default", which is the exact
	# thing this PCM exists to avoid — an unset variable would silently capture
	# the internal mic. Nothing here can prevent that, so launch.sh checks the
	# link it actually got.
	capture_node {
		@func getenv
		vars [ AUDIO_BRIDGE_NODE ]
		default "-1"
	}

	# Without a hint the PCM is not enumerable, and cpal opens only what it has
	# enumerated.
	hint {
		show on
		description "Scarlett capture, pinned by node"
	}
}
