[package]
name = "script-env"
version = "0.1.0"
edition = "2021"

[dependencies]
# Carries the bytecode VM as `rhai::grain`, so the server lowers a script to a
# flat artifact and the device runs that instead of parsing a tree. Measured on
# scripts/pulse.rhai: 756 allocations as an AST against 54 as an artifact,
# which is what the light could not afford — ESP-IDF charges ~8 bytes of header
# on every one.
rhai = { workspace = true }

[dev-dependencies]
# The device is sent the minified form, so pricing the AST per source byte has
# to measure what the server actually ships. Same minifier `/v1/script` uses.
rhaiper = { version = "0.2", default-features = false }
