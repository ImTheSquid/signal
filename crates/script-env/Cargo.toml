[package]
name = "script-env"
version = "0.1.0"
edition = "2021"

[dependencies]
rhai = { workspace = true }

[dev-dependencies]
# The device is sent the minified form, so pricing the AST per source byte has
# to measure what the server actually ships. Same minifier `/v1/script` uses.
rhaiper = { version = "0.2", default-features = false }
# Measuring only, for now: what follow.rhai lowers to, and how much of it the
# compiler cannot lower and hands back to the walker as an AST fragment. That
# residual keeps its AST cost, so it decides whether bytecode is worth adopting.
#
# rhaigrain goes here once it builds with this project's restriction flags. It
# declares `no_module` and `no_closure` as pass-throughs to rhai, but only
# `src/format/abi.rs` acts on them — the compiler and VM use `Stmt::Import`,
# `Stmt::Share`, `FnCallExpr::namespace`, `Dynamic::is_shared` and the four-field
# `Expr::Variable` box unguarded, so 29 errors across three files. Setting the
# flags on rhai alone is caught rather than tolerated, which is the crate doing
# the right thing; the guards just are not written yet.
#
# scripts/vendor-rhai.sh is already here for when they are.
