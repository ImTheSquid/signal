[package]
name = "validator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
script-env = { path = "../script-env" }
wasm-bindgen = "0.2"
serde_json = "1"
# Serialises the position sidecar the server keeps beside a job. Only the
# validator asks for it, so the firmware's rhai does not carry serde support.
rhai = { workspace = true, features = ["serde"] }
# The artifact is bytes and the frame carrying it is JSON.
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rhai → ahash needs a RNG; on wasm32 getrandom requires opting into the
# JS backend (paired with the getrandom_backend cfg in .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }
