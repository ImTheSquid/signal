[package]
name = "validator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
script-env = { path = "../script-env" }
wasm-bindgen = "0.2"
serde_json = "1"
# `default-features = false` drops the `cli` feature's clap; only the library is
# wanted here. rhaiper compiles against the workspace's restricted rhai, so its
# own compile checks reject anything the firmware's engine would reject too.
rhaiper = { version = "0.2", default-features = false }
# The artifact is bytes and the frame carrying it is JSON.
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rhai → ahash needs a RNG; on wasm32 getrandom requires opting into the
# JS backend (paired with the getrandom_backend cfg in .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }
