# /etc/nginx/conf.d/traffic-light-cache.conf — proxy_cache_path must live at
# http{} level, which is what conf.d/ is included into on Ubuntu.
#
# /v1/status is public and unauthenticated; without a shared cache in front,
# every dashboard poller reaches Redis.
proxy_cache_path /var/cache/nginx/traffic-light levels=1:2
                 keys_zone=traffic_light:1m max_size=16m inactive=60s;
