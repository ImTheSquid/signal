# /etc/nginx/sites-available/signal — the hostname must match ORIGIN in
# docker-compose.yml and ws_url in firmware/cfg.toml.
#
# Requires Cloudflare SSL/TLS mode Full (strict). Flexible reaches the origin
# over plain HTTP, which breaks SvelteKit's CSRF origin check.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # HTTP/1.1 only: websocket upgrades require it, and Cloudflare speaks 1.1
    # to origins regardless.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name signal.jackhogan.me;

    # Cloudflare Origin CA, *.jackhogan.me, expires 2039 — no renewal hook.
    ssl_certificate     /etc/nginx/ssl/cf/certificate.pem;
    ssl_certificate_key /etc/nginx/ssl/cf/key.pem;

    # Scripts cap at 16KB; this bounds the API surface well above that.
    client_max_body_size 1m;

    location /api/device {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/traffic-light-ws.conf;
    }

    location /api/live {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/traffic-light-ws.conf;
    }

    # Honours the endpoint's own s-maxage=10; collapses concurrent pollers
    # into a single origin request.
    location = /v1/status {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache traffic_light;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name signal.jackhogan.me;
    return 301 https://$host$request_uri;
}
