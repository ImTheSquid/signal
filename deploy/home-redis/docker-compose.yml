services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: locks/jobs live by TTL; an eviction policy could silently
    # drop a live lock under memory pressure.
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD}",
        "--appendonly", "yes",
        "--maxmemory", "64mb",
        "--maxmemory-policy", "noeviction"
      ]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  # Upstash-compatible REST proxy; the SvelteKit routes speak this.
  srh:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:8079:80"
    depends_on:
      - redis

volumes:
  redis-data:
