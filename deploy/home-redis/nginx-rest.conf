# REST endpoint for @upstash/redis (SvelteKit routes).
# Drop in /etc/nginx/sites-available/redis-rest, symlink into sites-enabled.
# Replace redis.example.com throughout.
server {
    listen 443 ssl http2;
    server_name redis.example.com;

    ssl_certificate /etc/letsencrypt/live/redis.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redis.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8079;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
