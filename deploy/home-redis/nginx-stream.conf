# TLS-terminated raw Redis for ioredis (the Vercel websocket function).
# stream{} must sit at nginx.conf top level (NOT inside http{}):
#   sudo mkdir -p /etc/nginx/streams.d
#   sudo cp nginx-stream.conf /etc/nginx/streams.d/redis.conf
#   then add to the BOTTOM of /etc/nginx/nginx.conf:
#       stream { include /etc/nginx/streams.d/*.conf; }
# Requires the stream module: sudo apt install libnginx-mod-stream
server {
    listen 6380 ssl;

    ssl_certificate /etc/letsencrypt/live/redis.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redis.example.com/privkey.pem;

    proxy_pass 127.0.0.1:6379;
    # SUBSCRIBE connections idle between events; don't let nginx cut them.
    # (Vercel recycles the function at 300s, so 15m is generous.)
    proxy_timeout 15m;
}
