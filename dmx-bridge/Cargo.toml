[package]
name = "dmx-bridge"
version = "0.1.0"
authors = ["Jack Hogan <jackhogan11@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "dmx-bridge"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
anyhow = "1"
toml-cfg = "0.2"

[build-dependencies]
embuild = "0.33"
toml-cfg = "0.2"

# TinyUSB is not in ESP-IDF core; pull it from the component registry, the same
# way firmware/ pulls esp_websocket_client.
[[package.metadata.esp-idf-sys.extra_components]]
# 1.x, not 2.x: esp-idf-sys 0.37's bindings.h includes tinyusb_types.h, which
# esp_tinyusb dropped in its 2.0 breaking changes.
remote_component = { name = "espressif/esp_tinyusb", version = "^1.7" }

# Makes esp-idf-sys's bindgen pass able to resolve TinyUSB's FreeRTOS includes.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/tinyusb_bindgen_shim"]
