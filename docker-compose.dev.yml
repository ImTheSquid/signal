services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Upstash-compatible REST proxy so @upstash/redis works against local redis.
  srh:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: dev_token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      - redis
