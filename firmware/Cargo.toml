[package]
name = "firmware"
version = "0.2.1"
authors = ["Jack Hogan <jackhogan11@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "firmware"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml-cfg = "0.2"
script-env = { path = "../crates/script-env" }
wsframe = { path = "../crates/wsframe" }

[build-dependencies]
embuild = "0.33"
toml-cfg = "0.2"

# The websocket client left ESP-IDF core in v5; pull it from the component registry.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "^1.1" }
