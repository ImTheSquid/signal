[package]
name = "firmware"
version = "0.2.1"
authors = ["Jack Hogan <jackhogan11@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "firmware"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
# Size here is not about flash. Static DRAM (.data + .bss) and IRAM text come
# out of the same pool the heap is carved from, and the interpreter lives close
# to that floor — so every byte the linker saves is a byte a script can use.
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
# No embassy features: nothing here uses it. The template brings in embassy-time,
# its timer driver and its sync primitives, and `rg embassy src/` finds nothing —
# so it was a timer queue and a pile of code the light was carrying for free.
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Artifacts are bytes and the frames carrying them are JSON.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
toml-cfg = "0.2"
script-env = { path = "../crates/script-env" }
wsframe = { path = "../crates/wsframe" }
# Declared here only to add `no_optimize` to what script-env already asks for —
# cargo unions features, so this applies to the firmware build and not to the
# validator's. rhai's optimiser runs a whole pass over the tree after parsing,
# and the peak during `compile` is what has to fit in the heap, not the AST it
# finally keeps. The validator cannot drop it: rhaiper needs OptimizationLevel.
#
# The cost is that constant folding no longer happens, so a script does slightly
# more work at run time. On a board that reboots when compilation runs out of
# memory, that is a trade worth making.
rhai = { version = "1", features = ["no_optimize"] }
# Rust's allocations go through talc rather than straight to ESP-IDF's malloc.
# Two reasons, in order of size:
#
#  - Fragmentation. The interpreter makes ~2100 small allocations per run and
#    hands them all back; the board idles with 140796 free but a largest block of
#    110592, and the script thread needs a contiguous 32KB stack out of that.
#    talc draws a few large slabs from ESP-IDF instead, so the C side's heap sees
#    a handful of blocks rather than thousands.
#  - Header size. ESP-IDF's TLSF charges ~8 bytes per allocation, talc one usize
#    (4 here), which is worth ~8KB across those allocations.
#
# Drawn on demand from the system allocator rather than a static arena: a fixed
# split would starve either the scripts or the TLS handshake, and which one is
# not knowable ahead of time.

# Repeated from the root manifest rather than inherited: this crate is
# `exclude`d from that workspace so it can use the xtensa toolchain, which makes
# it its own build root, and Cargo only honours `[patch]` from the root it is
# building. Without it the graph would hold two copies of rhai, and its feature
# flags change what a `Dynamic` is — so two copies means two incompatible
# `Dynamic` types either side of the artifact.
[patch.crates-io]
rhai = { git = "https://github.com/rhaiscript/rhai", rev = "72ad275f0db410120945d31fa686647135f1f99f" }

[build-dependencies]
embuild = "0.33"
toml-cfg = "0.2"

# The websocket client left ESP-IDF core in v5; pull it from the component registry.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "^1.1" }
